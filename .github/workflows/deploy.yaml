name: CI/CD and Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  code-analysis:
    name: Code analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up python
        id: setup-python
        uses: actions/setup-python@v5
        with:
            python-version: 3.12.2
            cache: pip

      - name: Install dependencies 
        run: pip install -r requirements.txt

      - name: Check format
        run: |
         black --check .

  build-and-deploy:
    needs: code-analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build --platform linux/amd64 -t ${{ secrets.DOCKER_USERNAME }}/resolve-with-ai-backend:latest .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/resolve-with-ai-backend:latest

      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Stop and remove the existing container if it exists
            docker stop resolve-with-ai-backend || true
            docker rm resolve-with-ai-backend || true
            
            # Remove the old image
            docker rmi ${{ secrets.DOCKER_USERNAME }}/resolve-with-ai-backend:latest || true
            
            # Run the new container with environment variables
            docker run -d \
              --name resolve-with-ai-backend \
              -p 6969:6969 \
              --env-file .env \
              ${{ secrets.DOCKER_USERNAME }}/resolve-with-ai-backend:latest

      - name: Verify deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Check if container is running
            echo "Checking container status..."
            docker ps | grep resolve-with-ai-backend
            
            # Check container logs
            echo "Container logs:"
            docker logs resolve-with-ai-backend --tail 50
            
            # Check if the application is responding
            echo "Checking application health..."
            curl -f http://4.223.175.167|| echo "Health check failed"
